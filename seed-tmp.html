const out = document.getElementById("out");
(async () => {
  try {
    firebase.initializeApp(window.FIREBASE_CONFIG);
    const db = firebase.firestore();
    const snap = await db.collection("posts").where("status", "in", ["approved", "pending"]).get();
    const have = new Set(snap.docs.map(d => d.data().text));
    const need = 200 - snap.size;
    if (need <= 0) { out.textContent = "DONE before=" + snap.size + " added=0"; return; }
    const pool = [];
    const n = Math.max(S.length, P.length);
    for (let i = 0; i < n; i++) {
      if (S[i] && !have.has(S[i])) pool.push(["student", S[i]]);
      if (P[i] && !have.has(P[i])) pool.push(["parent", P[i]]);
    }
    let added = 0, t = Date.now() - pool.length * 60000;
    for (const [role, text] of pool.slice(0, need)) {
      const id = "seed" + Math.random().toString(36).slice(2, 12);
      await db.collection("posts").doc(id).set({ type: "word", role, text, status: "approved", createdAt: t + added * 60000, pid: "seed" });
      added++; out.textContent = "adding " + added + "/" + need;
    }
    out.textContent = "DONE before=" + snap.size + " added=" + added + " pool=" + pool.length;
  } catch (e) { out.textContent = "ERR " + e.message; }
})();
